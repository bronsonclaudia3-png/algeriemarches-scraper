name: AlgerieMarches Daily Scraper

on:
  schedule:
    # Runs everyday at 07:00 UTC (08:00 AM Algeria UTC+1)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Sync to Google Sheet
        env:
          AM_EMAIL: ${{ secrets.AM_EMAIL }}
          AM_PASSWORD: ${{ secrets.AM_PASSWORD }}
          AM_KEYWORDS: ${{ secrets.AM_KEYWORDS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          python scraper.py

      - name: Commit and Push Updated Data & Cookies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state/cookies.json
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated scrape update $(date +'%Y-%m-%d %H:%M')"
          git push
        continue-on-error: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-data
          path: |
            data/*.csv
            scraper.log
          retention-days: 14
